<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ASH-BAND | AI Orchestrator</title>

    <script defer src="/__/firebase/12.10.0/firebase-app-compat.js"></script>
    <script defer src="/__/firebase/12.10.0/firebase-firestore-compat.js"></script>
    <script defer src="/__/firebase/12.10.0/firebase-functions-compat.js"></script>
    <script defer src="/__/firebase/init.js?useEmulator=false"></script>

    <style>
      :root {
        --neon-blue: #00f2ff;
        --neon-pink: #ff00ff;
        --bg-dark: #050505;
      }

      body { 
        background: var(--bg-dark); 
        color: var(--neon-blue); 
        font-family: 'Segoe UI', Roboto, Helvetica, sans-serif; 
        margin: 0; 
        display: flex; 
        flex-direction: column;
        justify-content: center; 
        align-items: center; 
        height: 100vh;
        overflow: hidden;
      }

      #glass-card { 
        background: rgba(255, 255, 255, 0.03); 
        border: 1px solid rgba(0, 242, 255, 0.2);
        backdrop-filter: blur(15px);
        padding: 3rem; 
        border-radius: 20px; 
        text-align: center;
        box-shadow: 0 0 40px rgba(0, 242, 255, 0.1);
        max-width: 400px;
        width: 80%;
      }

      h1 { 
        font-size: 2.5rem; 
        letter-spacing: 0.5rem; 
        margin: 0; 
        text-transform: uppercase;
        filter: drop-shadow(0 0 8px var(--neon-blue));
      }

      .tagline { 
        color: var(--neon-pink); 
        font-family: 'Courier New', monospace; 
        font-weight: bold;
        margin-top: 10px;
        letter-spacing: 2px;
      }

      #status-indicator {
        margin-top: 30px;
        font-size: 0.7rem;
        text-transform: uppercase;
        color: #444;
        letter-spacing: 1px;
      }

      .pulse {
        display: inline-block;
        width: 8px;
        height: 8px;
        background: var(--neon-blue);
        border-radius: 50%;
        margin-right: 8px;
        box-shadow: 0 0 10px var(--neon-blue);
        animation: pulse-animation 2s infinite;
      }

      @keyframes pulse-animation {
        0% { opacity: 1; }
        50% { opacity: 0.3; }
        100% { opacity: 1; }
      }
    </style>
  </head>
  <body>

    <div id="glass-card">
      <h1>ASH-BAND</h1>
      <div class="tagline">> ORCHESTRATOR_ACTIVE</div>
      
      <div id="status-indicator">
        <span class="pulse"></span>
        <span id="load">Initializing Neural Link...</span>
      </div>
    </div>

    <script>
      document.addEventListener('DOMContentLoaded', function() {
        const loadEl = document.querySelector('#load');
        try {
          let app = firebase.app();
          loadEl.textContent = 'Core Synced: Firebase v12.10.0';
        } catch (e) {
          console.error(e);
          loadEl.textContent = 'Link Failure: Check Console';
        }
      });
    </script>
  </body>
</html>

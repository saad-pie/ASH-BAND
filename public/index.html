<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>ASH-BAND | AI Orchestrator</title>

    <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-functions-compat.js"></script>

    <style>
      :root {
        --neon-blue: #00f2ff;
        --neon-pink: #ff00ff;
        --bg-dark: #050505;
        --glass: rgba(255, 255, 255, 0.03);
      }

      body { 
        background: var(--bg-dark); 
        color: var(--neon-blue); 
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
        margin: 0; 
        display: flex; 
        flex-direction: column;
        align-items: center; 
        height: 100vh;
        overflow: hidden;
      }

      header {
        margin-top: 40px;
        text-align: center;
      }

      #glass-card { 
        background: var(--glass); 
        border: 1px solid rgba(0, 242, 255, 0.2);
        backdrop-filter: blur(15px);
        padding: 1.5rem 2rem; 
        border-radius: 24px; 
        text-align: center;
        box-shadow: 0 0 30px rgba(0, 242, 255, 0.05);
        max-width: 350px;
        width: 85%;
        margin-top: 20px;
      }

      h1 { 
        font-size: 2.2rem; 
        letter-spacing: 0.4rem; 
        margin: 0; 
        text-transform: uppercase;
        filter: drop-shadow(0 0 8px var(--neon-blue));
      }

      .tagline { 
        color: var(--neon-pink); 
        font-family: 'Courier New', monospace; 
        font-weight: bold;
        margin-top: 5px;
        font-size: 0.9rem;
      }

      #ai-terminal {
        width: 85%;
        max-width: 350px;
        background: rgba(0, 0, 0, 0.4);
        border: 1px solid #111;
        border-radius: 15px;
        margin-top: 20px;
        padding: 15px;
        flex-grow: 1;
        margin-bottom: 40px;
        overflow-y: auto;
        font-family: 'Courier New', monospace;
        font-size: 0.75rem;
        color: #888;
      }

      .btn-container {
        display: flex;
        gap: 10px;
        width: 100%;
        margin-top: 20px;
      }

      .action-btn {
        background: transparent;
        border: 1px solid var(--neon-blue);
        color: var(--neon-blue);
        padding: 12px 10px;
        border-radius: 50px;
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 1px;
        cursor: pointer;
        transition: 0.3s;
        flex: 1;
        font-size: 0.7rem;
      }

      .action-btn.virtual {
        border-color: var(--neon-pink);
        color: var(--neon-pink);
      }

      .action-btn:active {
        background: var(--neon-blue);
        color: var(--bg-dark);
      }

      .action-btn.virtual:active {
        background: var(--neon-pink);
        color: white;
      }

      #status-indicator {
        margin-top: 10px;
        font-size: 0.65rem;
        text-transform: uppercase;
        color: #555;
      }

      .pulse {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: var(--neon-blue);
        border-radius: 50%;
        margin-right: 5px;
        animation: pulse-animation 2s infinite;
      }

      @keyframes pulse-animation {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.2; transform: scale(1.2); }
      }
    </style>
  </head>
  <body>

    <header>
      <h1>ASH-BAND</h1>
      <div class="tagline">STEVE-AI ORCHESTRATOR</div>
    </header>

    <div id="glass-card">
      <div id="status-indicator">
        <span class="pulse"></span>
        <span id="load">Initializing Neural Link...</span>
      </div>
      
      <div class="btn-container">
        <button class="action-btn" onclick="connectBluetooth()">Sync Band</button>
        <button class="action-btn virtual" onclick="startVirtualMode()">Virtual Mode</button>
      </div>
    </div>

    <div id="ai-terminal">
      <div style="color: var(--neon-blue)">[SYSTEM READY]</div>
      <div id="log-start">> Awaiting selection...</div>
    </div>

    <script>
      const HF_URL = "wss://saadpie1-ash-band.hf.space/audio";
      const firebaseConfig = {
        apiKey: "AIzaSyCVbQwneJ4KRqM1BD88BXZ8qhbzXd9NpGI",
        authDomain: "ash-band.firebaseapp.com",
        projectId: "ash-band",
        storageBucket: "ash-band.firebasestorage.app",
        messagingSenderId: "583584228734",
        appId: "1:583584228734:web:356f4404fb5af242cdff2f",
        measurementId: "G-7V6PMMBPHM"
      };

      const logContainer = document.getElementById('ai-terminal');
      let socket;
      let audioCtx;
      let nextStartTime = 0; // For seamless audio playback scheduling
      
      function updateLog(msg, color = '#888') {
        const div = document.createElement('div');
        div.style.color = color;
        div.textContent = `> ${msg}`;
        logContainer.appendChild(div);
        logContainer.scrollTop = logContainer.scrollHeight;
      }

      // VIRTUAL MODE: Phone becomes the Band
      async function startVirtualMode() {
        updateLog("Initializing Virtual Orchestrator...", "#ff00ff");
        try {
          // Initialize Audio Context immediately to bypass mobile autoplay blocks
          if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
          }
          if (audioCtx.state === 'suspended') await audioCtx.resume();

          socket = new WebSocket(HF_URL);
          socket.binaryType = 'arraybuffer';

          socket.onopen = async () => {
            updateLog("Cloud Link Established", "#00f2ff");
            document.getElementById('load').textContent = "VIRTUAL_BAND_ACTIVE";
            await initAudioStreaming();
          };

          socket.onmessage = (event) => {
            if (event.data instanceof ArrayBuffer) {
              playBinaryAudio(event.data);
            }
          };

          socket.onerror = (e) => updateLog("Cloud Error: Check Space Status", "#ff4444");

        } catch (err) {
          updateLog("Virtual Initialization Failed", "#ff4444");
        }
      }

      // Playback logic: Converts raw Int16 bytes to Float32 for Web Audio
      function playBinaryAudio(arrayBuffer) {
        const int16Data = new Int16Array(arrayBuffer);
        const float32Data = new Float32Array(int16Data.length);
        
        for (let i = 0; i < int16Data.length; i++) {
          float32Data[i] = int16Data[i] / 32768.0; // Normalize PCM
        }

        const buffer = audioCtx.createBuffer(1, float32Data.length, 24000);
        buffer.getChannelData(0).set(float32Data);

        const source = audioCtx.createBufferSource();
        source.buffer = buffer;
        source.connect(audioCtx.destination);

        // Schedule playback to be seamless
        const currentTime = audioCtx.currentTime;
        if (nextStartTime < currentTime) nextStartTime = currentTime;
        source.start(nextStartTime);
        nextStartTime += buffer.duration;
      }

      async function initAudioStreaming() {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          const micSource = audioCtx.createMediaStreamSource(stream);
          const processor = audioCtx.createScriptProcessor(4096, 1, 1);

          micSource.connect(processor);
          processor.connect(audioCtx.destination);

          processor.onaudioprocess = (e) => {
            const input = e.inputBuffer.getChannelData(0);
            const pcm16 = new Int16Array(input.length);
            for (let i = 0; i < input.length; i++) {
              pcm16[i] = Math.max(-1, Math.min(1, input[i])) * 0x7FFF;
            }
            if (socket && socket.readyState === WebSocket.OPEN) {
              socket.send(pcm16.buffer);
            }
          };
          updateLog("Mic Active: Streaming to SteveAI...");
        } catch (e) {
          updateLog("Mic Permission Denied", "#ff4444");
        }
      }

      // Bluetooth Bridge Logic (For physical Band)
      async function connectBluetooth() {
        try {
          updateLog("Scanning for ASH-BAND-ONE...");
          const device = await navigator.bluetooth.requestDevice({
            filters: [{ name: 'ASH-BAND-ONE' }],
            optionalServices: ['4fafc201-1fb5-459e-8fcc-c5c9c331914b']
          });
          updateLog("Connecting to Hardware...", "#00f2ff");
          const server = await device.gatt.connect();
          document.getElementById('load').textContent = "HARDWARE_LINK_ACTIVE";
          updateLog("Hardware Synced!", "#ff00ff");
        } catch (e) {
          updateLog("Hardware Link Failed", "#ff4444");
        }
      }

      document.addEventListener('DOMContentLoaded', function() {
        const loadEl = document.querySelector('#load');
        try {
          if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
          loadEl.textContent = 'Core Synced: Link Ready';
          updateLog("Firebase Orchestrator Online", "#00f2ff");
        } catch (e) {
          loadEl.textContent = 'Link Failure: Check Config';
          updateLog("Firebase Init Error", "#ff4444");
        }
      });
    </script>
  </body>
</html>

name: Build ASH-BAND Mobile Apps
on:
  push:
    branches: [ main ]

jobs:
  # --- ANDROID BUILD ---
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22 # Updated for Capacitor 8.2.0
          
      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Initialize & Sync Android
        run: |
          npx cap add android || echo "Android platform already exists"
          npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ash-band-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

  # --- iOS BUILD ---
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22 # Updated for Capacitor 8.2.0

      - name: Install Dependencies
        run: npm install

      - name: Initialize & Sync iOS
        run: |
          npx cap add ios || echo "iOS platform already exists"
          npx cap sync ios

      - name: Build iOS App (Unsigned)
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
                     -scheme App \
                     -configuration Debug \
                     -sdk iphoneos \
                     CODE_SIGNING_ALLOWED=NO

      - name: Upload iOS Build
        uses: actions/upload-artifact@v4
        with:
          name: ash-band-ios-build
          path: ios/App/

name: Build ASH-BAND Mobile Apps
on:
  push:
    branches: [ main ]

jobs:
  # --- ANDROID BUILD ---
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Initialize & Sync Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Sign Android APK
        id: sign_app
        run: |
          # 1. Decode keystore from GitHub Secrets
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.keystore

          # 2. Use apksigner (built into the Ubuntu runner)
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks release.keystore \
            --ks-pass pass:${{ secrets.ANDROID_KEY_ALIAS }} \
            --ks-key-alias ${{ secrets.ANDROID_KEY_ALIAS }} \
            --out ash-band-signed.apk \
            android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ash-band-android-final
          path: ash-band-signed.apk

  # --- iOS BUILD (Cloud Signing Method) ---
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: brew install openssl minizip

      - name: Build zsign (Direct Path Compilation)
        run: |
          git clone https://github.com/zhlynn/zsign.git
          cd zsign
          # Explicitly pointing to source and common directories to fix header errors
          g++ src/*.cpp src/common/*.cpp \
              -I./src \
              -I./src/common \
              -I/usr/local/opt/openssl/include \
              -L/usr/local/opt/openssl/lib \
              -lcrypto -lminizip -O3 -o zsign
          sudo cp zsign /usr/local/bin/

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Initialize & Sync iOS
        run: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          npx cap sync ios

      - name: Build iOS App Bundle
        run: |
          # Optimized Release build for the ASH-BAND engine
          xcodebuild -project ios/App/App.xcodeproj \
                     -scheme App \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     AD_HOC_CODE_SIGNING_ALLOWED=YES \
                     clean build

      - name: Sign IPA (No-PC Method)
        run: |
          # Decode iOS Secrets
          echo "${{ secrets.IOS_P12_BASE64 }}" | base64 -d > cert.p12
          echo "${{ secrets.IOS_PROVISION_BASE64 }}" | base64 -d > cert.mobileprovision

          # Use compiled zsign to generate the signed IPA
          zsign -k cert.p12 \
                -p ${{ secrets.IOS_P12_PASSWORD }} \
                -m cert.mobileprovision \
                -o ASH-BAND-Signed.ipa \
                -z 9 \
                build/Build/Products/Release-iphoneos/App.app

      - name: Upload Signed IPA
        uses: actions/upload-artifact@v4
        with:
          name: ash-band-ios-final
          path: ASH-BAND-Signed.ipa
